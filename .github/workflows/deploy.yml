name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy examples into public/
        run: cp -r examples public/examples

      - name: Inject API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          node -e "
            const fs = require('fs');
            const key = process.env.ANTHROPIC_API_KEY;
            let html = fs.readFileSync('public/index.html', 'utf8');
            html = html.replace('__ANTHROPIC_API_KEY__', key);
            fs.writeFileSync('public/index.html', html);
            console.log('Injection complete');
          "

      - name: Verify injection worked
        run: |
          if grep -q '__ANTHROPIC_API_KEY__' public/index.html; then
            echo "❌ API key was NOT injected — check that ANTHROPIC_API_KEY secret is set in repo settings"
            exit 1
          else
            echo "✅ API key injected successfully"
          fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
