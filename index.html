<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creative Factory</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f0f0f; color: #e0e0e0; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .subtitle { color: #888; font-size: 0.85rem; margin-bottom: 28px; }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
    }

    label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }

    input, select, textarea {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 0.95rem;
      padding: 10px 12px;
      margin-bottom: 14px;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: #555; }
    select option { background: #1a1a1a; }
    textarea { resize: vertical; min-height: 80px; font-family: inherit; }

    .api-key-row { display: flex; gap: 8px; align-items: flex-start; }
    .api-key-row input { margin-bottom: 0; }
    .api-key-row button { flex-shrink: 0; margin-top: 0; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    button {
      background: #fff;
      color: #000;
      border: none;
      border-radius: 6px;
      padding: 11px 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #generate-btn {
      width: 100%;
      padding: 13px;
      font-size: 1rem;
      margin-top: 4px;
    }

    .section-title { font-size: 0.75rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 14px; }

    #status {
      font-size: 0.9rem;
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }
    #status.info  { background: #1a2a1a; border: 1px solid #2a4a2a; color: #6fcf6f; display: block; }
    #status.error { background: #2a1a1a; border: 1px solid #4a2a2a; color: #cf6f6f; display: block; }

    #output-section { display: none; }
    #output-section.visible { display: block; }

    .output-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .output-title { font-size: 1rem; font-weight: 600; color: #fff; }
    .copy-btn {
      background: #2a2a2a;
      color: #ccc;
      font-size: 0.8rem;
      padding: 6px 12px;
    }
    .copy-btn:hover { background: #333; opacity: 1; }

    #output {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 20px;
      white-space: pre-wrap;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.82rem;
      line-height: 1.65;
      color: #d4d4d4;
      max-height: 80vh;
      overflow-y: auto;
    }

    #output .md-h2  { color: #fff; font-size: 1rem; font-weight: 700; margin-top: 1.5em; margin-bottom: 0.5em; display: block; }
    #output .md-h3  { color: #e0c47a; font-size: 0.9rem; font-weight: 600; margin-top: 1.2em; margin-bottom: 0.3em; display: block; }
    #output .md-h4  { color: #7ac0e0; font-size: 0.85rem; font-weight: 600; margin-top: 0.8em; display: block; }
    #output .md-bold { color: #fff; font-weight: 600; }
    #output .md-hr  { border: none; border-top: 1px solid #2a2a2a; margin: 1em 0; display: block; }

    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid #444;
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .settings-toggle {
      background: none;
      border: none;
      color: #555;
      font-size: 0.8rem;
      padding: 0;
      text-decoration: underline;
      cursor: pointer;
    }
    .settings-toggle:hover { color: #888; opacity: 1; }

    .saved-badge {
      font-size: 0.75rem;
      color: #6fcf6f;
      margin-left: 8px;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .saved-badge.show { opacity: 1; }
  </style>
</head>
<body>

96wg-xXayAgAA">
        <button onclick="saveApiKey()">Save</button>
      </div>
      <div style="font-size:0.78rem; color:#555; margin-top:4px;">Stored in localStorage — never sent anywhere except Anthropic's API.</div>

  <!-- Form -->
  <div class="card">

    <div class="grid-2">

    <label for="audience">Target Audience</label>
    <input type="text" id="audience" placeholder="e.g. Self-employed truckers aged 40-55 in the Midwest">

    <label for="pain">Pain Points</label>
    <textarea id="pain" placeholder="e.g. Paying too much in taxes, no retirement plan, worried about leaving family with nothing"></textarea>

  <!-- Output -->

  <script>
    // ── Init ──────────────────────────────────────────────────────────────
    window.addEventListener('load', () => {
      const injected = document.getElementById('api-key').value;
      if (injected && !injected.startsWith('__')) {
        localStorage.setItem('cf_api_key', injected);
      }
      const stored = localStorage.getItem('cf_api_key');
      if (stored) document.getElementById('api-key').value = stored;
    });

    function toggleSettings() {
      document.getElementById('settings-panel').classList.toggle('open');
    }

    function saveApiKey() {
      const key = document.getElementById('api-key').value.trim();
      if (key) {
        localStorage.setItem('cf_api_key', key);
        const badge = document.getElementById('saved-badge');
        badge.classList.add('show');
        setTimeout(() => badge.classList.remove('show'), 2000);
      }
    }

    function setStatus(msg, type) {
      const el = document.getElementById('status');
      el.textContent = msg;
      el.className = type;
    }

    function clearStatus() {
      const el = document.getElementById('status');
      el.style.display = 'none';
      el.className = '';
    }

    // ── Fetch knowledge base files ────────────────────────────────────────
    async function fetchKB(filename) {
      try {
        const res = await fetch('./examples/' + filename);
        if (!res.ok) return '';
        return await res.text();
      } catch {
        return '';
      }
    }

    async function loadKnowledgeBase() {
      const [scripts, visual, compliance, lessons] = await Promise.all([
        fetchKB('WINNING_SCRIPTS.md'),
        fetchKB('VISUAL_STYLE_GUIDE.md'),
        fetchKB('COMPLIANCE_APPROVED_LANGUAGE.md'),
        fetchKB('lessons.md'),
      ]);

      let kb = '';
      if (scripts)    kb += '\n\n## WINNING SCRIPTS KNOWLEDGE:\n' + scripts;
      if (visual)     kb += '\n\n## VISUAL STYLE KNOWLEDGE:\n' + visual;
      if (compliance) kb += '\n\n## COMPLIANCE KNOWLEDGE:\n' + compliance;
      if (lessons)    kb += '\n\n## LESSONS LEARNED (HIGHEST PRIORITY - USER CORRECTIONS):\n' + lessons;
      return kb;
    }

    // ── Build prompt ──────────────────────────────────────────────────────
    function buildPrompt(clientName, product, audience, pain, angle, knowledgeBase) {
      return `You are an expert life insurance copywriter who creates high-converting ad scripts based on proven patterns.

${knowledgeBase}

---

CLIENT INFO:
- Name: ${clientName}
- Product: ${product}
- Target Audience: ${audience}
- Pain Points: ${pain}
- Unique Angle: ${angle}

---

CRITICAL SCRIPT REQUIREMENTS:
- NO first-person references ("I'm a professional", "I helped", "my clients", "I've seen")
- Focus on THEM (the viewer) and their emotional pain
- Scripts feel like breaking news exposé or insider leak, NOT sales pitch
- Social proof = anonymous relatable people ("Business owners like you"), NOT "my clients"
- Remove ALL credential-flexing - the message creates authority, not titles
- Pure emotion, urgency, benefits - make them FEEL something and WANT to click
- Conspiracy angle should be about THEM vs big companies, not about you as the messenger
- Use patterns from the WINNING SCRIPTS KNOWLEDGE above

---

TASK:
Generate a complete creative package with 5 image prompts and 3 HeyGen video prompts (each with full embedded scripts).

### MEMORY SETUP (Paste once into HeyGen Memory — saves forever)

**Video delivery style:**
"Direct-to-camera podcast style with urgent, emotional delivery. Speaker maintains strong eye contact and speaks like they're revealing insider information that could change the viewer's life. NO sales pitch energy. Pure urgency and emotion. Tone feels like exposing a conspiracy or breaking major news."

**Target audience and niche:**
"Life insurance marketing ads for ${audience}. ${product === 'Final Expense' ? 'Emotional family-focused messaging that removes fear and creates urgency around protecting loved ones.' : product === 'IUL' ? 'Urgent tax-focused messaging for high earners frustrated with overpaying. Speak to their pain and anger about being robbed by the IRS.' : 'Urgent protective messaging for young families worried about leaving their kids unprotected.'} Every word should make them FEEL something."

**Music preference:**
"Dramatic background music with building tension. Opening should feel urgent like breaking news. Build intensity during problem/agitation. Confident during solution. Music should amplify emotion without overpowering voice."

**Caption style preference:**
"Bold pop-style captions with breaking news aesthetic placed in upper third of frame (never lower third). Text large and prominent — impossible to miss on mobile. Red banners for shocking numbers and deadlines. Yellow warnings for urgency. Green/pink highlights for trust-building phrases. Every caption should amplify emotion and create urgency."

    // ── Render markdown-ish output ────────────────────────────────────────
    function renderOutput(text) {
      const el = document.getElementById('output');
      const html = text
        .replace(/^## (.+)$/gm, '<span class="md-h2">## $1</span>')
        .replace(/^### (.+)$/gm, '<span class="md-h3">### $1</span>')
        .replace(/^#### (.+)$/gm, '<span class="md-h4">#### $1</span>')
        .replace(/\*\*(.+?)\*\*/g, '<span class="md-bold">**$1**</span>')
        .replace(/^---$/gm, '<span class="md-hr"></span>');
      el.innerHTML = html;
    }

    // ── Main generate function ────────────────────────────────────────────
    async function generate() {
      const apiKey    = (document.getElementById('api-key').value || localStorage.getItem('cf_api_key') || '').trim();
      const client    = document.getElementById('client').value.trim();
      const product   = document.getElementById('product').value;
      const audience  = document.getElementById('audience').value.trim();
      const pain      = document.getElementById('pain').value.trim();
      const angle     = document.getElementById('angle').value.trim() || 'None specified';

      if (!apiKey)   { setStatus('Enter your Anthropic API key in Settings above.', 'error'); toggleSettings(); return; }
      if (!client)   { setStatus('Client name is required.', 'error'); return; }
      if (!audience) { setStatus('Target audience is required.', 'error'); return; }
      if (!pain)     { setStatus('Pain points are required.', 'error'); return; }

      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Loading knowledge base...';
      clearStatus();
      document.getElementById('output-section').classList.remove('visible');

      try {
        const kb = await loadKnowledgeBase();
        if (kb.length < 100) {
          setStatus('⚠️ Knowledge base files not found — generating without them. Serve from repo root for full context.', 'info');
        }

        btn.innerHTML = '<span class="spinner"></span>Generating creatives (30–60s)...';
        const prompt = buildPrompt(client, product, audience, pain, angle, kb);

        const res = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'x-api-key': apiKey,
            'anthropic-version': '2023-06-01',
            'content-type': 'application/json',
            'anthropic-dangerous-direct-browser-access': 'true',
          },
          body: JSON.stringify({
            model: 'claude-sonnet-4-20250514',
            max_tokens: 8000,
            messages: [{ role: 'user', content: prompt }],
          }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.error?.message || `API error ${res.status}`);
        }

        const data = await res.json();
        const output = data.content[0].text;

        renderOutput(output);
        document.getElementById('output-section').classList.add('visible');
        document.getElementById('output-section').scrollIntoView({ behavior: 'smooth' });
        clearStatus();

      } catch (err) {
        setStatus('Error: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Generate Creatives';
      }
    }

    function copyOutput() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy All', 2000);
      });
    }
  </script>
